<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>กยศ. PIM Online</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B7A4C">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="กยศ. PIM">

  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: linear-gradient(135deg, #0F9D63 0%, #0B7A4C 55%, #075C3A 100%);
      font-family: 'IBM Plex Sans Thai', 'Segoe UI', sans-serif;
    }
    #appFrame {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0px));
      border: none; display: block;
    }
    .splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F9D63 0%, #0B7A4C 55%, #075C3A 100%);
      transition: opacity .3s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .wrap { text-align: center; color: #fff; }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    p { margin-top: 16px; font-size: 14px; opacity: .9; }
    .dot { display:inline-block; width:6px; height:6px; margin:0 2px; border-radius:50%;
           background:#F6D889; animation: pulse 1.2s infinite ease-in-out; }
    .dot:nth-child(2){ animation-delay:.15s } .dot:nth-child(3){ animation-delay:.3s }
    @keyframes pulse { 0%,80%,100%{opacity:.3;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
  </style>
</head>
<body>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbzcg4MWypzG1XMNMI0-G9KNhKfDeggXYmV8sI64nsN6KN_PaZyHQIXsgf5kyZiTZicrhQ/exec"
          onload="document.getElementById('splash').classList.add('hide')"></iframe>

  <div class="splash" id="splash">
    <div class="wrap">
      <img src="icon-192.png" alt="กยศ. PIM">
      <p>กำลังเปิดระบบ<span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
